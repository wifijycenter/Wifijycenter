<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>JY CENTER — Déconnecté</title>
<link rel="icon" href="/img/logo.jpg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="hero small">
  <img class="logo" src="/img/logo.jpg" alt="JY CENTER">
</header>
<main class="wrap">
  <section class="card ok">
    <div class="badge">✓</div>
    <h1>Vous êtes déconnecté</h1>
    <p class="sub">Merci d'avoir utilisé le Wi-Fi JY CENTER. À bientôt !</p>
    <div class="rows">
      <div class="row"><span>Code / Utilisateur</span><span>$(username)</span></div>
      <div class="row"><span>Durée de la session</span><span>$(uptime)</span></div>
    </div>
    <a class="btn" href="$(link-login)">SE RECONNECTER</a>
  </section>
</main>
<footer>
  Besoin d'aide ? Appelez-nous<br>
  <a href="tel:0749415409">0749415409</a>
</footer>
</body>
</html>
